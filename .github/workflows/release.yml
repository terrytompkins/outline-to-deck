# Publish a release with deck-tools.zip whenever a version tag (v2.0.0, v2.1.0-beta.1, ...) is pushed.
# Tags with a hyphen are marked as pre-releases.
name: Release tools bundle

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tests (deck tests skip without Playwright)
        run: python3 -m unittest discover tools/tests
      - name: Build the bundle
        run: python3 tools/make-bundle.py
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/deck-tools.zip \
            --title "$GITHUB_REF_NAME" --notes-file .github/release-notes.md --verify-tag $pre
